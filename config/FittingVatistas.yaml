seed: 7068

# ---------------------------------------------------------------------------
# Vatistas parameter-space fitting (VortexTransformer paper, Section 3.1.2).
# Fit the mixture-of-2 Vatistas profile (Eq. 10) to real-flow 32x32 patches,
# record the fitted 7-parameter distribution, and re-sample it to synthesize
# new steady fields. See docs/vatistas_profile.md.
# ---------------------------------------------------------------------------

dataset:
  # dat_dir=null -> relocate_flow2d_dataset_folder() fills the machine default.
  dat_dir: null
  # Real flows to fit. t_start/t_end are TIME-STEP indices (null = all steps);
  # they are clamped to each field's available range. Following the paper:
  # cylinder 600-1000, Boussinesq 500-800, RFC64 all slices.
  fields:
    - {name: cylinder2d, t_start: 600, t_end: 1000, t_stride: 4}
    - {name: boussinesq, t_start: 500, t_end: 800,  t_stride: 4}
    - {name: rfc2d,      t_start: null, t_end: null, t_stride: 1}
  patch_size: 32          # spatial patch (paper: 32x32)
  patch_stride: 16        # sliding-window stride (conv-kernel style)
  min_patch_rms: 1.0e-4   # skip near-empty patches (RMS speed below this)
  normalize_patch: true   # scale each patch to unit RMS before fitting
  max_patches: 1500       # cap total patches (paper fit ~1500); random subsample if exceeded

model:
  num_profiles: 2         # m in Eq. 10 (mixture of up to two Vatistas vortices)
  # base-shape candidates the optimizer may pick per profile:
  #   0 = saddle (S1), 1 = clockwise center (S2), 2 = counter-clockwise center (S3)
  shape_candidates: [1, 2]
  # Physical bounds (local patch frame is normalized to [-1, 1]^2). These are the TIGHT,
  # paper-plausible bounds: cores stay near the patch and scales are moderate, so the
  # fitted distribution -> generated fields are clearly vortex-like.
  # NOTE: RELAXING them (rc[0.02,4] n[0.5,8] s[0.05,10] t[3.0]) lets a distant vortex's
  # far-field approximate laminar/shear patches and raises fit PSNR by ~+2 dB, BUT the
  # distribution then spreads wider and generated fields look more far-field than
  # vortex-like -- kept tight here on purpose (generation quality > fit PSNR).
  bounds:
    rc: [0.05, 2.0]       # core radius
    n:  [0.5, 6.0]        # profile shape exponent
    s:  [0.05, 5.0]       # anisotropic scale sx, sy (kept positive; theta gives orientation)
    t:  [1.5]             # |tx|, |ty| <= this

optim:
  device: null            # null -> cuda if available else cpu
  # Tuned to maximize PSNR of the m=2 (paper-faithful) fit WHILE keeping tight, vortex-like
  # bounds (see model.bounds). Cumulative effect of the knobs (full 1500-patch, mean PSNR):
  #   paper-vanilla         sa200 gd400 const  random  r1   -> 26.8 dB / 0.0228
  #   + restarts            sa200 gd400 const  random  r8   -> 31.8 dB / 0.0107
  #   + more SA/GD + decay  sa800 gd1600 decay random  r8   -> 33.8 dB / 0.0103
  #   + data-driven init    sa800 gd1600 decay datadr. r8   -> ~34.3 dB
  #   + more restarts       sa800 gd1600 decay datadr. r16  -> THIS DEFAULT: 34.7 dB / 0.0094
  # Relaxing model.bounds adds ~+2 dB more but harms generation (see that comment).
  # Levers that did NOT help: base-shape saddle, SA temperature/flip tuning, L-BFGS polish
  # (Adam+cosine already converges tightly -> L-BFGS is a no-op here; left off below).
  init_mode: datadriven   # seed vortex cores/orientation from patch vorticity (vs 'random')
  n_restarts: 16          # SA+GD from independent inits, best-per-patch kept (8 halves runtime for ~-0.6 dB)
  sa_iters: 800           # simulated annealing iterations
  gd_iters: 1600          # gradient-descent refinement iterations
  sa_T0: 1.0              # initial annealing temperature (loss is O(1) after normalize)
  sa_Tend: 1.0e-3         # final temperature
  sa_shape_flip_p: 0.2    # per-iter probability of proposing a base-shape flip
  gd_lr: 0.05             # initial Adam learning rate for the refinement stage
  gd_lr_final: 0.005      # cosine-decay target lr (== gd_lr disables decay)
  lbfgs_iters: 0          # optional 2nd-order polish after Adam (0=off; no gain observed here)

generate:
  num_fields: 100         # NEW steady fields sampled from the fitted distribution
  grid: 64                # render resolution of each generated field on [-1,1]^2
  min_vortices: 1         # sample m in [min_vortices, max_vortices] per field
  max_vortices: 2
  enforce_spacing: true   # core distance > sum of radii (paper's spacing constraint)
  min_contribution: 0.05  # a fitted profile joins the distribution only if it carries >=5% of patch energy

output:
  out_dir: null           # null -> <cache_dir>/vatistas_fit
  save_plots: true        # save distribution histograms + a few fit/generation previews
