seed: 7068
epochs: 3
train_points_count: 72000
batch_size: 12
print_freq: 200

lr: 0.0001
optimizer:
  NAME: 'adamw'
  weight_decay: 0.000001

loss:
  NAME: MSELoss

model:
  # NAME: ESPCN
  # NAME: UpsamplingUnetModel
  # NAME: FTLEUpsamplingFMT_Unet
  # NAME: FTLEUpsamplingFMT_UnetV3
  # NAME: FTLEUpsamplingFMT_Vit
  NAME: FTLEUpsamplingFMT_UnetV2
  # NAME: FTLEUpsamplingDCT_FMT_UnetV2  # Fourier/DCT tokenizer twin of FMT_UnetV2 (training-free encoder)
  # NAME: ConditionalFMTNetV3
  # NAME: FTLEUpsamplingViTBaseline
  # NAME: ConditionalFMTNet
  # NAME: FTLEUpsamplingFMT_Vit_Version2

# mode: upsamplingFLowMap
# mode = 'point_FTLE_regression'
mode : upsamplingFLowMap

wandb: False

# Pipeline validation/debug checks (FTLE computation, dataset, training, testing).
# 0=off (default, ~zero cost), 1=warn+log one-line summaries, 2=strict (raise on failure).
# Can also be enabled via env FMT_DEBUG=1 or `--debug 1` on the compare harness.
debug: 1

dataset:
  trainTimesliceCount: 20 # TRAIN slice count (FTLEUpsamplingTrainDataset).
  low_res_grid_sampling: 0.25 #low resolution ftle's grid =vectorfield.grid*low_res_grid_sampling
  UPsampling: 2 # must be integer
  dat_dir: C:\\Users\\xingdi\\OneDrive - KAUST\\WorkingInProcess\\FLowVisAssets\\flowData2d
  # name: cylinder2d #beads2d  doublegyre2d pipedcylinder2d cylinder2d  GerrisFlowSolverData/*.am
  # GerrisFlowSolverDatadebug removed (folder absent -> "url wrong"). Enlarged train set with more fields.
  input_names: [cylinder2d, boussinesq, doublegyre2d, rfc2d, beads2d, pipedcylinder2d]
  extension: nc
  t_start: 0.1 # skip the first 10% of the time window when sampling slices
  t_target: 0.9 # skip the last 10% of the time window when sampling slices
  patchSize: 32 #modify this according to low_res_grid_sampling, since low_res_grid_sampling will influence how large the low res ftle grid , it could happen that low res ftle grid is smaller than patchSize
  patchStride: 4 # when do fast testing or generate traing dataset, real patchStride is patchStride*4(for faster testing and training), only finaly visualize, use patchStride
  
test_tasks: test_UpsamplingModel
test_vectorfield: [doublegyre2d,cylinder2d]
test_timesliceCount: 5 # TEST slice count (build_test_dataset uses timesliceCount).




pnn:
  split: 3
  points: 1024
  stages: 2
  dim: 24
  k: 6
  alpha: 1000
  beta: 100


# DCT_FMT (Fourier tokenizer) hyper-parameters. Only used by FTLEUpsamplingDCT_FMT_UnetV2.
# k is auto-clamped to (sampled_points_per_line - 1); with sampled_points_per_line=4 the
# usable DFT length is 3, so effective k <= 3.
dct:
  k: 6              # number of low-frequency |FFT| magnitudes kept per channel
  weight: 0.5       # scale on the neighbor block when concatenating
  neighbor_diff_scale: 100.0  # amplify the (neighbor-center) relative-velocity signal before DFT



# set the params to generate the point clouds
pcds:
  sample_area: full #points full areas
  line_type: p_line # streamline   p_line-> pathline
  line_method: RK4 # RK4 Euler
  dt: 0.005 # flowline integration dt 

  max_iterations: 200 # FTLE integration window = dt*max_iterations (=3.0). Expanded 1.5x from 200 for sharper FTLE ridges.
  sampled_points_per_line: 16 # samples one the line
  offset_dist: 0.005 # scale of grid interval
  num_cross_points_per_seeding: 5 


  normalized: False
  localized: False

  max_seg: 50
  start_points: [[0.0,0.0]]
  bbox: [[2.5,0.5],[5.5,1.5]] # [[xmin1,ymin1] [xmax1,ymax1],[xmin2,ymin2],[xmax2,ymax2]]

